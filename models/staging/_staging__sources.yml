version: 2

#   =============================================================================
#   SOURCES
#   =============================================================================
#   Declaring sources does three things that hard-coding table names does not:
#
#       1. `{{ source('tasty_bytes_raw', 'customer') }}` renders to the fully
#           qualified table name. Change the database once here and every model
#           follows.
#
#       2. The raw tables appear in the DAG and in the lineage graph, so you can
#           answer "what breaks if this table changes?" without reading any SQL.
#
#       3. Freshness becomes checkable. `dbt source freshness` tells you the
#           source stopped arriving BEFORE you build a mart on top of stale data
#           and publish yesterday's numbers as today's.
#
#   Freshness thresholds below are set against _LOADED_AT, and are deliberately
#   generous for a training project where the "days" are simulated.
#   =============================================================================

sources: 

  - name: tasty_bytes_raw 
    description: > 
        Operational data landed from the Tasty Bytes point-of-sale and customer 
        systems. Written by the ingestion process, never by dbt — the 
        DBT_TRAINING_TRANSFORM role holds SELECT here and nothing more. 
    database: DBT_TRAINING_DB 
    schema: RAW 
    
    # Applies to every table below unless overridden. 
    config: 
        loaded_at_field: _LOADED_AT 
        freshness: 
            warn_after: {count: 36, period: hour} 
            error_after: {count: 72, period: hour}
        
    tables: 
      - name: customer 
        description: > 
            Customer master, overwritten in place by the source system. Has NO 
            reliable update timestamp, which is why snap_customer must use the 
            `check` strategy. Rows can be hard-deleted (right to erasure). 
        columns: 
          - name: customer_id 
            description: Primary key from the operational system. 
            data_tests: 
              - unique 
              - not_null 
          - name: loyalty_tier 
            description: Current loyalty tier. Changes over time. 
          - name: city 
            description: Current city of residence. Changes over time. 
            
      - name: truck 
        description: > 
            Food truck master. Maintains a trustworthy UPDATED_AT, which is why
            snap_truck can use the cheaper `timestamp` strategy. 
        columns: 
          - name: truck_id 
            data_tests: 
              - unique 
              - not_null 
          - name: updated_at 
            description: > 
                Last modification time in the source system. Trusted — this is 
                the column snap_truck watches. 
            data_tests: 
              - not_null 
              
      - name: location 
        description: Trading locations. Modelled as Type 1 — no history kept. 
        columns: 
          - name: location_id 
            data_tests: 
              - unique 
              - not_null 
              
      - name: menu_item 
        description: > 
            Menu. SALE_PRICE_USD is the CURRENT price. Historical prices live on 
            the order lines, not here. 
        columns: 
          - name: menu_item_id 
            data_tests: 
              - unique 
              - not_null 
              
      - name: order_header 
        description: > 
            One row per order. ORDER_TS is when the sale happened; _LOADED_AT is 
            when we found out about it. Those differ for late-arriving orders, 
            and every incremental model in this project watermarks on the latter. 
        # Orders arrive daily, so a tighter threshold than the source default. 
        config: 
            freshness: 
                warn_after: {count: 30, period: hour} 
                error_after: {count: 48, period: hour} 
        columns: 
          - name: order_id 
            data_tests: 
              - unique 
              - not_null 
          - name: order_status 
            data_tests: 
              - accepted_values: 
                  arguments: 
                    values: ['COMPLETED', 'CANCELLED'] 
          - name: customer_id 
            data_tests: 
              - relationships: 
                  arguments: 
                    to: source('tasty_bytes_raw', 'customer') 
                    field: customer_id 
                  # WARN, not ERROR — and this is a deliberate teaching point. 
                  # From Day 3, customer 5 is erased from the source while her 
                  # historical orders remain. That is correct behaviour, not a 
                  # defect, so this test must report rather than halt the build.
                  # Choosing severity is a modelling decision: it encodes what 
                  # you believe SHOULD be true versus what MUST be true. 
                  config: 
                      severity: warn 
                      
      - name: order_line 
        description: > 
            One row per item on an order. UNIT_PRICE_USD is the price at the 
            moment of sale. Rows can be RESTATED — updated in place, with a new 
            _LOADED_AT — which is why the fact tables merge rather than append. 
        columns: 
          - name: order_line_id 
            data_tests: 
              - unique 
              - not_null 
          - name: order_id 
            data_tests: 
              - not_null 
              - relationships: 
                  arguments: 
                    to: source('tasty_bytes_raw', 'order_header') 
                    field: order_id 
          - name: menu_item_id 
            data_tests: 
              - relationships: 
                  arguments: 
                    to: source('tasty_bytes_raw', 'menu_item') 
                    field: menu_item_id
